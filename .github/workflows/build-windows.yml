# apeCsound - Windows build (x64): Csound 7 static -> Projucer -> VST3 + Standalone
#
# 1. builds Csound 7 + libsndfile + libsamplerate as static libraries with
#    scripts/build_csound_static_windows.ps1 (cached between runs)
# 2. builds Projucer from JUCE, sets the global JUCE module path and
#    re-saves apeCsound.jucer (Builds/ and JuceLibraryCode/ are not in git)
# 3. builds Builds/VisualStudio2022/apeCsound.sln (Release, x64)
# 4. uploads apeCsound.vst3 and apeCsound.exe as an artifact (and attaches
#    a zip to the GitHub Release when the run comes from a "v*" tag)
#
# Run it from the "Actions" tab (Run workflow), or push a tag: git tag v1.0.1 && git push --tags

name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

env:
  # JUCE version: keep it equal to the one used on the Mac (Projucer > About).
  JUCE_REF: "9.0.4"
  # Visual Studio 2026 (vedi il commento su runs-on)
  CSOUND_CMAKE_GENERATOR: "Visual Studio 18 2026"
  VS_TOOLSET: "v145"

jobs:
  windows:
    # windows-latest: Visual Studio 18 (2026). Csound viene configurato con il
    # generatore CMake "Visual Studio 18 2026"; i progetti Visual Studio
    # (Projucer e apeCsound, generati dall'exporter VS2022 del .jucer) vengono
    # compilati con il toolset di VS 2026 (v145) tramite /p:PlatformToolset.
    # Per tornare a VS 2022: runs-on: windows-2022, CSOUND_CMAKE_GENERATOR
    # "Visual Studio 17 2022" e VS_TOOLSET v143.
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout apeCsound
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_REF }}
          path: JUCE

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Il generatore "Visual Studio 18 2026" richiede CMake 4.2 o successivo.
      - name: Setup CMake (latest)
        uses: lukka/get-cmake@latest

      # ------------------------------------------------------------------
      # 1. Csound static (Debug + Release libs, static MSVC runtime)
      # ------------------------------------------------------------------
      # restore + save separati: la cache viene salvata subito dopo la build di
      # Csound, anche se un passo successivo (Projucer, apeCsound) fallisce.
      - name: Restore Csound static build
        id: csound-cache
        uses: actions/cache/restore@v4
        with:
          path: build/csound-install/windows
          key: csound-windows-${{ env.VS_TOOLSET }}-${{ hashFiles('scripts/build_csound_static_windows.ps1') }}

      - name: Build Csound (static)
        if: steps.csound-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build_csound_static_windows.ps1

      - name: Save Csound static build
        if: steps.csound-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/csound-install/windows
          key: ${{ steps.csound-cache.outputs.cache-primary-key }}

      # ------------------------------------------------------------------
      # 2. Projucer -> Builds/VisualStudio2022
      # ------------------------------------------------------------------
      - name: Build Projucer
        shell: pwsh
        run: |
          # JUCE recenti hanno anche Builds/VisualStudio2026: si usa quello se c'e'.
          $sln = @("VisualStudio2026", "VisualStudio2022") |
                 ForEach-Object { "JUCE/extras/Projucer/Builds/$_/Projucer.sln" } |
                 Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sln) { throw "Projucer.sln not found" }
          Write-Host "Projucer solution: $sln"
          msbuild $sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=$env:VS_TOOLSET /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate Visual Studio project
        shell: pwsh
        run: |
          $projucer = Get-ChildItem -Recurse -Filter Projucer.exe JUCE/extras/Projucer/Builds | Select-Object -First 1
          if (-not $projucer) { throw "Projucer.exe not found" }
          $modules = (Resolve-Path JUCE/modules).Path
          # The .jucer uses the global JUCE path (useGlobalPath="1"): point it at the checkout.
          # "--set-global-search-path" only edits an EXISTING Projucer.settings, which a fresh
          # runner does not have, so the settings file is written here directly.
          $settingsDir = Join-Path $env:APPDATA "Projucer"
          New-Item -ItemType Directory -Force -Path $settingsDir | Out-Null
          $xml = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <PROPERTIES>
            <VALUE name="PROJECT_DEFAULT_SETTINGS">
              <PROJECT_DEFAULT_SETTINGS defaultJuceModulePath="$modules"/>
            </VALUE>
          </PROPERTIES>
          "@
          Set-Content -Path (Join-Path $settingsDir "Projucer.settings") -Value $xml.Trim() -Encoding UTF8
          Get-Content (Join-Path $settingsDir "Projucer.settings")
          # Projucer.exe is a GUI-subsystem app: "&" would not wait for it to finish.
          $p = Start-Process -FilePath $projucer.FullName -ArgumentList @("--resave", "apeCsound.jucer") -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Projucer --resave failed (exit $($p.ExitCode))" }
          if (-not (Test-Path Builds/VisualStudio2022/apeCsound.sln)) { throw "Projucer did not create Builds/VisualStudio2022/apeCsound.sln" }

      # ------------------------------------------------------------------
      # 3. VST3 + Standalone
      # ------------------------------------------------------------------
      - name: Build apeCsound (Release x64)
        shell: pwsh
        run: |
          msbuild Builds/VisualStudio2022/apeCsound.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=$env:VS_TOOLSET /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect binaries
        shell: pwsh
        run: |
          $rel = "Builds/VisualStudio2022/x64/Release"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vst3 = Get-ChildItem -Recurse -Directory -Filter apeCsound.vst3 $rel | Select-Object -First 1
          $exe  = Get-ChildItem -Recurse -File -Filter apeCsound.exe $rel | Select-Object -First 1
          if (-not $vst3) { throw "apeCsound.vst3 not found under $rel" }
          if (-not $exe)  { throw "apeCsound.exe not found under $rel" }
          Copy-Item -Recurse $vst3.FullName dist/
          Copy-Item $exe.FullName dist/
          Copy-Item README.md dist/
          Get-ChildItem -Recurse dist | Format-Table FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apeCsound-windows-x64
          path: dist/

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "apeCsound-${{ github.ref_name }}-windows-x64.zip"

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apeCsound-${{ github.ref_name }}-windows-x64.zip
